name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test -v 2

  docker:
    name: Docker build & push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/django-cicd-demo
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Run image & check site
    needs: docker
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/django-cicd-demo@${{ needs.docker.outputs.digest }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image from Docker Hub
        run: docker pull "$IMAGE"

      - name: Start container
        run: docker run -d --name site -p 8000:8000 "$IMAGE"

      - name: Wait until the site is up
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ > /dev/null; then
              echo "Site is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Site did not start in time"
          exit 1

      - name: Check that the running image is the one built from this commit
        run: |
          body=$(curl -fsS http://localhost:8000/health/)
          echo "$body"
          echo "$body" | grep -q "$GITHUB_SHA"

      - name: Check pages
        run: |
          for path in / /about/ /contact/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Show container logs on failure
        if: failure()
        run: docker logs site

      - name: Stop container
        if: always()
        run: docker rm -f site
